# Alembic configuration for the policy adjudication database.
# This file drives `alembic upgrade head` and migration generation.

[alembic]
# path to migration scripts
script_location = alembic

# Reads DATABASE_URL from the environment — no credentials in source control.
# Set it in .env or your CI environment.
sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
# No post-write hooks required.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
